name = "lifelog"
compatibility_date = "2026-07-01"
main = "worker/index.ts"

# Workerのログをダッシュボードに残す(Issue #206)。障害時に「リクエストがWorkerまで届いたか」を
# 後から確認できるようにするため。機密(APIトークン・サービスアカウント鍵・写真のbase64)は出さないこと
[observability]
enabled = true

[assets]
directory = "dist"
not_found_handling = "single-page-application"
binding = "ASSETS"
